name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # A tag v* builds the plugin for each platform and attaches it, with its
  # SHA-256 checksum, to a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=fontgarden-fontspectorplugin-${{ github.ref_name }}-${{ matrix.target }}
          tar -czf "$name.tar.gz" -C target/release fontgarden-fontspectorplugin
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 ||
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "" || true
          gh release upload "${{ github.ref_name }}" fontgarden-fontspectorplugin-*.tar.gz*
